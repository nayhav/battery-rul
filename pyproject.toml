[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neha-battery-rul"
version = "1.0.0"
description = "NASA battery remaining useful life with nested battery-level evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "joblib>=1.4,<2"]

[tool.setuptools.packages.find]
include = ["battery_rul*"]
